<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar cliente MySQL</title>
</head>
<body>
    <h1>Editar cliente en MySQL</h1>

    <form method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ cliente[1] }}" required><br><br>

        <label>Apellido:</label><br>
        <input type="text" name="apellido" value="{{ cliente[2] }}" required><br><br>

        <label>Correo:</label><br>
        <input type="email" name="correo" value="{{ cliente[3] }}" required><br><br>

        <label>Teléfono:</label><br>
        <input type="text" name="telefono" value="{{ cliente[4] }}" required><br><br>

        <label>Dirección:</label><br>
        <input type="text" name="direccion" value="{{ cliente[5] }}" required><br><br>

        <button type="submit">Actualizar cliente</button>
    </form>

    <br>
    <a href="/clientes_mysql">Volver a clientes</a>
    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
