<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto MySQL</title>
</head>
<body>
    <h1>Editar producto en MySQL</h1>

    <form method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ producto[1] }}" required><br><br>

        <label>Descripción:</label><br>
        <input type="text" name="descripcion" value="{{ producto[2] }}" required><br><br>

        <label>Precio:</label><br>
        <input type="number" step="0.01" name="precio" value="{{ producto[3] }}" required><br><br>

        <label>Stock:</label><br>
        <input type="number" name="stock" value="{{ producto[4] }}" required><br><br>

        <button type="submit">Actualizar producto</button>
    </form>

    <br>
    <a href="/productos_mysql">Volver a productos</a>
    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
