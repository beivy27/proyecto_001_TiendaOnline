{% extends "base.html" %}

{% block title %}Formulario de Producto{% endblock %}

{% block content %}
<h2 class="mb-4">
    {% if producto %}
        Editar Producto
    {% else %}
        Nuevo Producto
    {% endif %}
</h2>

<form method="POST">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" name="nombre" id="nombre" class="form-control"
               value="{{ producto.nombre if producto else '' }}" required>
    </div>

    <div class="mb-3">
        <label for="precio" class="form-label">Precio</label>
        <input type="number" step="0.01" name="precio" id="precio" class="form-control"
               value="{{ producto.precio if producto else '' }}" required>
    </div>

    <div class="mb-3">
        <label for="stock" class="form-label">Stock</label>
        <input type="number" name="stock" id="stock" class="form-control"
               value="{{ producto.stock if producto else '' }}" required>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('ver_productos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
